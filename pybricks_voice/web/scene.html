<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Robot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f27; font: 13px "Segoe UI", sans-serif; }
  #hud { position: absolute; left: 12px; bottom: 10px; color: #c9d1dc; background: #0008;
         padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  #help { position: absolute; right: 12px; top: 10px; color: #8a94a3; pointer-events: none; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="help">C: camera · scroll: zoom</div>
<script type="module">
import * as THREE from "./three.module.min.js";

// One unit is 1 cm. Python's frame: x right, y forward, heading clockwise from +y.
// three.js: x right, y up, -z forward, rotation.y counter-clockwise.
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f27);
scene.fog = new THREE.Fog(0x1b1f27, 250, 700);
const camera = new THREE.PerspectiveCamera(50, 1, 1, 2000);

scene.add(new THREE.HemisphereLight(0xdde6ff, 0x30343c, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(80, 160, 60);
sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -120;
sun.shadow.camera.right = sun.shadow.camera.top = 120;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);

// The table: a big floor with a 10 cm grid and a 1 m grid on top.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000),
                             new THREE.MeshStandardMaterial({ color: 0x2a303b, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const fine = new THREE.GridHelper(1000, 100, 0x3a4250, 0x343b47);
const coarse = new THREE.GridHelper(1000, 10, 0x56617a, 0x56617a);
fine.position.y = 0.02; coarse.position.y = 0.03;
scene.add(fine, coarse);
const start = new THREE.Mesh(new THREE.RingGeometry(3, 4, 32),
                             new THREE.MeshBasicMaterial({ color: 0x4f8cff }));
start.rotation.x = -Math.PI / 2; start.position.y = 0.05;
scene.add(start);

// A SPIKE-ish driving base: the axle midpoint is the robot's reference point,
// as it is for Pybricks' DriveBase.
const robot = new THREE.Group();
const white = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5 });
const yellow = new THREE.MeshStandardMaterial({ color: 0xffcd03, roughness: 0.45 });
const dark = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.8 });
const teal = new THREE.MeshStandardMaterial({ color: 0x00a3a6, roughness: 0.5 });
function box(w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  robot.add(m);
  return m;
}
box(9.6, 3.2, 12, white, 0, 4.2, -2);        // frame
box(8.8, 3.2, 5.6, yellow, 0, 7.4, -2.5);    // hub
box(5, 0.6, 3, dark, 0, 9.1, -2.5);          // hub screen
box(2.4, 2.4, 3.2, teal, 0, 4, -9.2);        // sensor at the front
const wheels = [];
for (const side of [-1, 1]) {
  const wheel = new THREE.Group();
  const tyre = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 1.4, 32), dark);
  tyre.rotation.z = Math.PI / 2; tyre.castShadow = true;
  const hub = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.6, 0.8), white);  // shows the spin
  hub.position.x = side * 0.4;
  wheel.add(tyre, hub);
  wheel.position.set(side * 5.6, 2.8, 0);
  robot.add(wheel);
  wheels.push(wheel);
}
const caster = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), white);
caster.position.set(0, 1, 6.5); caster.castShadow = true;
robot.add(caster);
const arrow = new THREE.Mesh(new THREE.ConeGeometry(1.2, 3, 3), new THREE.MeshBasicMaterial({ color: 0x4f8cff }));
arrow.rotation.x = -Math.PI / 2; arrow.position.set(0, 11, -6);
robot.add(arrow);
scene.add(robot);

// Where the robot has been.
const MAX_TRAIL = 50000;
const trailPositions = new Float32Array(MAX_TRAIL * 3);
const trailGeometry = new THREE.BufferGeometry();
trailGeometry.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3));
trailGeometry.setDrawRange(0, 0);
const trail = new THREE.Line(trailGeometry, new THREE.LineBasicMaterial({ color: 0x4f8cff }));
// Its bounding sphere is computed once, while the trail is empty at the origin,
// so culling would hide the whole trail whenever the camera looked away from there.
trail.frustumCulled = false;
scene.add(trail);
let trailCount = 0, last = null;
function addTrail(x, z) {
  if (last && Math.hypot(x - last[0], z - last[1]) < 0.5) return;
  if (trailCount >= MAX_TRAIL) return;
  trailPositions.set([x, 0.1, z], trailCount * 3);
  trailCount++; last = [x, z];
  trailGeometry.setDrawRange(0, trailCount);
  trailGeometry.attributes.position.needsUpdate = true;
}

let pose = { x: 0, y: 0, heading: 0, left: 0, right: 0, speed: 0 };
let chase = true, zoom = 1;
const hud = document.getElementById("hud");

function apply() {
  const x = pose.x / 10, z = -pose.y / 10;           // mm -> cm, forward is -z
  robot.position.set(x, 0, z);
  robot.rotation.y = -THREE.MathUtils.degToRad(pose.heading);
  wheels[0].rotation.x = -THREE.MathUtils.degToRad(pose.left);
  wheels[1].rotation.x = -THREE.MathUtils.degToRad(pose.right);
  addTrail(x, z);
  hud.textContent = `x ${(pose.x / 10).toFixed(1)} cm · y ${(pose.y / 10).toFixed(1)} cm · ` +
                    `heading ${pose.heading.toFixed(0)}° · ${(pose.speed / 10).toFixed(0)} cm/s`;
}

window.chrome?.webview?.addEventListener("message", (event) => {
  const m = event.data;
  if (m.pose) { pose = m.pose; apply(); }
  if (m.reset) {
    trailCount = 0; last = null; trailGeometry.setDrawRange(0, 0);
    pose = { x: 0, y: 0, heading: 0, left: 0, right: 0, speed: 0 }; apply();
  }
  if (m.camera) chase = m.camera === "chase";
});

addEventListener("keydown", (e) => { if (e.key === "c" || e.key === "C") chase = !chase; });
addEventListener("wheel", (e) => { zoom = Math.min(4, Math.max(0.3, zoom * (e.deltaY > 0 ? 1.1 : 0.9))); });

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const wanted = new THREE.Vector3(), look = new THREE.Vector3();
function frame() {
  if (chase) {
    // Behind and above, turning with the robot.
    const back = new THREE.Vector3(0, 45 * zoom, 60 * zoom).applyAxisAngle(new THREE.Vector3(0, 1, 0), robot.rotation.y);
    wanted.copy(robot.position).add(back);
    look.copy(robot.position).add(new THREE.Vector3(0, 5, 0));
  } else {
    wanted.set(robot.position.x, 260 * zoom, robot.position.z + 1);
    look.copy(robot.position);
  }
  camera.position.lerp(wanted, 0.08);
  camera.lookAt(look);
  sun.position.set(robot.position.x + 80, 160, robot.position.z + 60);
  sun.target.position.copy(robot.position);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
apply();
camera.position.set(0, 45, 60);
frame();
window.chrome?.webview?.postMessage({ ready: true });
</script>
</body>
</html>
