[project]
name = "pybricks-voice"
version = "0.1.0"
description = "Drive a (simulated) Pybricks robot by voice, with Whisper on the Snapdragon NPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# onnxruntime-qnn has no free-threaded (3.14t) wheels yet.
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "onnxruntime-qnn>=2.7; sys_platform == 'win32'",
    "typing_extensions>=4.14",  # Sentinel (PEP 661)
    "winrt-runtime>=4.0.2; sys_platform == 'win32'",
    "winrt-Microsoft.WindowsAppRuntime.Bootstrap; sys_platform == 'win32'",
    "winrt-Microsoft.WindowsAppSDK.WinUI; sys_platform == 'win32'",
    "winrt-Microsoft.WindowsAppSDK.InteractiveExperiences; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Graphics; sys_platform == 'win32'",
    "winrt-Windows.Media; sys_platform == 'win32'",
    "winrt-Windows.Media.Audio; sys_platform == 'win32'",
    "winrt-Windows.Media.Capture; sys_platform == 'win32'",
    "winrt-Windows.Media.MediaProperties; sys_platform == 'win32'",
    "winrt-Windows.Media.Render; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.System; sys_platform == 'win32'",
    "winrt-Windows.UI; sys_platform == 'win32'",
    "winrt-Windows.UI.Xaml.Interop; sys_platform == 'win32'",
    # --screenshot, through Windows.Graphics.Capture
    "winrt-Microsoft.UI.Interop; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Capture; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Capture.Interop; sys_platform == 'win32'",
    "winrt-Windows.Graphics.DirectX; sys_platform == 'win32'",
    "winrt-Windows.Graphics.DirectX.Direct3D11; sys_platform == 'win32'",
    "winrt-Windows.Graphics.DirectX.Direct3D11.Interop>=4.1.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Security.Authorization.AppCapabilityAccess; sys_platform == 'win32'",
    # The 3D view. Its FreeType DLL comes from tools/get_freetype.py on Windows ARM64.
    "pygfx>=0.17.0",
    # windows/scene_view.py makes the SwapChainPanel surface through wgpu-py internals.
    "wgpu>=0.32,<0.33",
    # The physics. On Windows ARM64 its wheel comes from tools/get_mujoco.py.
    "mujoco>=3.17",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]

[tool.uv]
# An app, not a library: run it from the checkout.
package = false

# MuJoCo has no Windows ARM64 wheels: tools/get_mujoco.py builds one into
# vendor/wheels/, used only there. Locking needs that wheel, on any machine.
[[tool.uv.index]]
name = "vendor"
url = "vendor/wheels"
format = "flat"
explicit = true

[tool.uv.sources]
mujoco = { index = "vendor", marker = "sys_platform == 'win32' and platform_machine == 'ARM64'" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff's own
    "T20",     # no print(): the app logs
    "G",       # logging calls let logging do the formatting
    "D209", "D213",  # multi-line docstrings: """ on lines of their own
    "ASYNC",   # no blocking calls in coroutines: they would stall the UI thread
    "TID251",  # the banned APIs below
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ×, °, “” and … are meant in user-facing text and comments
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The app's asyncio loop is a guest of WinUI's DispatcherQueue (loop.py): it
# is already running, and must be the only one.
"asyncio.run".msg = "the app's loop is already running (loop.py): create a task on it"
"asyncio.get_event_loop".msg = "use asyncio.get_running_loop()"
"asyncio.new_event_loop".msg = "the app has one loop, a guest of the UI thread (loop.py)"
"asyncio.set_event_loop".msg = "the app has one loop, a guest of the UI thread (loop.py)"
# Structured concurrency: tasks live in a TaskGroup, which cancels the rest and
# raises when one fails, and time limits are asyncio.timeout() blocks.
"asyncio.gather".msg = "use an asyncio.TaskGroup: it cancels the others when one fails"
"asyncio.wait".msg = "use an asyncio.TaskGroup, or asyncio.timeout() for a time limit"
"asyncio.wait_for".msg = "use an asyncio.timeout() block"
"asyncio.shield".msg = "let cancellation through: shielded work outlives the task that awaited it"

[tool.ruff.lint.per-file-ignores]
# Command-line scripts, where printing is the point, and with loops of their own.
"tools/*" = ["T20", "TID251"]
"spikes/*" = ["T20"]
# Windows-only code imports its platform's packages after `assert not
# TYPE_CHECKING or sys.platform == "win32"`, which type checking elsewhere stops at.
"pybricks_voice/windows/*" = ["E402"]
"tests/windows/*" = ["E402"]
"tools/{check_whisper,eval_commands,mic_channels}.py" = ["E402", "T20", "TID251"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["pybricks_voice", "tests", "tools"]
extraPaths = ["tools"]
