[project]
name = "pybricks-voice"
version = "0.1.0"
description = "Drive a (simulated) Pybricks robot by voice, with Whisper on the Snapdragon NPU"
readme = "README.md"
# onnxruntime-qnn has no free-threaded (3.14t) wheels yet.
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "onnxruntime-qnn>=2.7",
    "typing_extensions",
    "winrt-runtime>=4.0.2",
    "winrt-Microsoft.WindowsAppRuntime.Bootstrap",
    "winrt-Microsoft.WindowsAppSDK.WinUI",
    "winrt-Microsoft.WindowsAppSDK.InteractiveExperiences",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Graphics",
    "winrt-Windows.Media",
    "winrt-Windows.Media.Audio",
    "winrt-Windows.Media.Capture",
    "winrt-Windows.Media.MediaProperties",
    "winrt-Windows.Media.Render",
    "winrt-Windows.Media.SpeechSynthesis",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.System",
    "winrt-Windows.UI",
    "winrt-Windows.UI.Xaml.Interop",
    # The 3D view. Its FreeType DLL comes from tools/get_freetype.py on Windows ARM64.
    "pygfx>=0.17.0",
    # scene.py makes the SwapChainPanel surface through wgpu-py internals.
    "wgpu>=0.32,<0.33",
]

[dependency-groups]
dev = [
    "pillow",  # --screenshot
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]

[tool.uv]
# An app, not a library: run it from the checkout.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff's own
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ×, °, “” and … are meant in user-facing text and comments
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["pybricks_voice", "tests", "tools"]
extraPaths = ["tools"]
